<div class="helppanel">
  <div class="hp-head">
    <span class="caps-sm">Help</span>
    <button type="button" class="btn btn-outline btn-small" onclick="this.closest('dialog').close()" aria-label="Close help">×</button>
  </div>
  {% if page %}
  <h2>{{ page.title }}</h2>
  <div class="helptext">{{ page.html|safe }}</div>
  <a href="/help/{{ page.slug }}">Open in the Help Center →</a>
  {% else %}
  <p class="hint">No help page for this yet. <a href="/help">Open the Help Center</a>.</p>
  {% endif %}
</div>
