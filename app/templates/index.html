{% extends "base.html" %}
{% block content %}
<div class="card mb-4">
  <div class="card-body">
    <h3 class="card-title">New request</h3>
    <form method="post" action="/jobs" class="d-flex gap-2">
      <input name="query" class="form-control" required
             placeholder="e.g. latest CE level 2 motorcycle jacket standards">
      <button class="btn btn-primary">Search &amp; crawl</button>
    </form>
  </div>
</div>

<div class="card">
  <div class="card-header"><h3 class="card-title">Jobs</h3></div>
  <div hx-get="/jobs/table" hx-trigger="every 3s" hx-swap="innerHTML">
    {% include "_jobs.html" %}
  </div>
</div>
{% endblock %}
